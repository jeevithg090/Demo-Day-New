<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found · Apollo Voice AI</title>
    <meta name="description" content="The page you were looking for does not exist.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#1a56db">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/static/base.css">
    <script src="/static/ui.js"></script>
    <style>
        .not-found {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: var(--space-6) var(--space-4);
        }

        .not-found .card {
            width: min(100%, 460px);
            padding: var(--space-10) var(--space-6);
            text-align: center;
        }

        .not-found img {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--space-6);
        }

        .not-found .code {
            font-family: var(--font-mono);
            font-size: var(--text-sm);
            font-weight: 600;
            color: var(--primary-text);
        }

        .not-found h1 {
            margin-top: var(--space-2);
            font-size: var(--text-2xl);
        }

        .not-found p {
            margin-top: var(--space-3);
            color: var(--text-muted);
        }

        .not-found .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: var(--space-3);
            margin-top: var(--space-8);
        }

        .not-found .theme-toggle {
            position: fixed;
            top: var(--space-3);
            right: var(--space-3);
        }
    </style>
</head>

<body>
    <button type="button" class="btn-icon theme-toggle" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>
    <main class="not-found">
        <div class="card">
            <img src="/static/favicon.svg" alt="">
            <p class="code">Error 404</p>
            <h1>Page not found</h1>
            <p>The page you were looking for doesn’t exist or has moved.</p>
            <div class="actions">
                <a class="btn btn-primary" href="/">Go to the assistant</a>
                <a class="btn btn-secondary" href="/admin">Open admin panel</a>
            </div>
        </div>
    </main>
</body>

</html>
