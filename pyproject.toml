[project]
name = "apollo-voice-ai"
version = "2.1.0"
description = "Real-time regional-language voice AI assistant for hospital patient queries"
readme = "README.md"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends()/File() in argument defaults

[tool.ruff.lint.per-file-ignores]
"voice_ai/signals.py" = ["E501"]
"voice_ai/conversation.py" = ["E501"]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
